[package]
name = "gen-python"
description = "Python API for the gen sequence graph and version control system."
version = "0.5.1"
edition = "2024"
repository = "https://github.com/genhub-bio/gen"
homepage = "https://genhub.bio"
license = "Apache-2.0"
publish = false

[lib]
name = "gen_python"
crate-type = ["cdylib", "rlib"]
# Docstrings hold Python examples for the generated stubs, not Rust doctests.
doctest = false

[[example]]
name = "remote_gcs_fixture"
path = "tests/support/remote_gcs_fixture.rs"
required-features = ["abi3", "extension-module"]

[features]
default = []
abi3 = ["pyo3/abi3-py311"]
extension-module = ["pyo3/extension-module"]

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
flate2 = "1.1.5"
gen = { path = "..", version = "0.5.1", default-features = false, features = ["diff", "models", "remote"] }
gen-annotations = { path = "../gen-annotations", version = "0.5.1" }
gen-core = { path = "../gen-core", version = "0.5.1", features = ["python-bindings"] }
gen-graph = { path = "../gen-graph", version = "0.5.1" }
gen-models = { path = "../gen-models", version = "0.5.1" }
gen-tui = { path = "../gen-tui", version = "0.5.1", default-features = false }
log = "0.4.26"
petgraph = "0.6.5"
pyo3-stub-gen = "0.23"
ratatui = { version = "0.30.0", default-features = false }
rusqlite = { package = "rusqdoltlite", version = "0.41.1", features = ["bundled", "array", "limits", "fallible_uint"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dependencies.pyo3]
version = "0.29.3"
features = ["multiple-pymethods", "generate-import-lib"]

[dev-dependencies]
base64 = "0.22.1"
crc32c = "0.6.8"
tempfile = "3"

[build-dependencies]
pyo3-build-config = "0.29"

[workspace]
members = ["."]
