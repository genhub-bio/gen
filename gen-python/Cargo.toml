[package]
name = "gen-python"
description = "Python API for the gen sequence graph and version control system."
version = "0.2.0"
edition = "2024"
repository = "https://github.com/genhub-bio/gen"
homepage = "https://genhub.bio"
license = "Apache-2.0"
publish = false

[lib]
name = "gen_python"
crate-type = ["cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
flate2 = "1.1.5"
gen = { path = "..", version = "0.2.0" }
gen-annotations = { path = "../gen-annotations", version = "0.2.0" }
gen-core = { path = "../gen-core", version = "0.2.0", features = ["python-bindings"] }
gen-graph = { path = "../gen-graph", version = "0.2.0" }
gen-models = { path = "../gen-models", version = "0.2.0" }
gen-tui = { path = "../gen-tui", version = "0.2.0", default-features = false }
log = "0.4.26"
petgraph = "0.6.5"
ratatui = { version = "0.30.0", default-features = false }
rusqlite = { package = "rusqdoltlite", version = "0.40.1", features = ["bundled", "array", "limits", "session", "fallible_uint"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dependencies.pyo3]
version = "0.25.1"
features = ["multiple-pymethods", "generate-import-lib"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
pyo3-build-config = "0.25"

[workspace]
members = ["."]
