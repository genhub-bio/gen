[workspace]

[package]
name = "jupyter-widget"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
ratatui = { version = "0.30.0", default-features = false }
ratzilla = "0.3.0"
gen-core = { path = "../../gen-core", default-features = false }
gen-graph = { path = "../../gen-graph", default-features = false }
gen-tui = { path = "../../gen-tui", default-features = false }
log = "0.4.26"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-time = "1.1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Document",
  "Element",
  "DomRect",
] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
