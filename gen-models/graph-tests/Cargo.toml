[package]
name = "gen-models-graph-tests"
description = "Cross-crate integration tests for graph-backed model workflows."
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
gen-core = { path = "../../gen-core", version = "0.2.1" }
gen-graph = { path = "../../gen-graph", version = "0.2.1" }
gen-models = { path = "..", version = "0.2.1" }
gen-models-doltlite = { path = "../../gen-models-doltlite", version = "0.2.1" }
intervaltree = "0.2.7"
rusqlite = { package = "rusqdoltlite", version = "0.40.14", features = ["bundled", "array", "limits", "fallible_uint", "backup"] }
tempfile = "3.20.0"
