[package]
name = "gen-models"
description = "Models for the gen sequence graph and version control system."
version = "0.1.17"
edition = "2024"
repository = "https://github.com/genhub-bio/gen"
homepage = "https://genhub.bio"
license = "Apache-2.0"
publish = false
include = ["src", "../migrations"]

[features]
benchmark = []

[build-dependencies]
capnpc = { version = "0.24" }

[dev-dependencies]
rand = "0.9.2"
tempfile = "3.20.0"

[dependencies]
gen-core = { path = "../gen-core" }
gen-graph = { path = "../gen-graph" }
cached = "0.55.1"
capnp = { version = "0.24" }
include_dir = "0.7.4"
chrono = "0.4.40"
fallible-streaming-iterator = "0.1.9"
intervaltree = "0.2.7"
itertools = "0.14.0"
noodles = { version = "0.101.0", features = ["async", "bed", "bgzf", "core", "fasta", "gff", "gtf", "vcf"] }
petgraph = "0.6.5"
rusqlite = { version = "0.32.1", features = ["bundled", "array", "limits", "session"] }
rusqlite_migration = { version = "1.3.1" , features = ["from-directory"]}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
url = "2.5.0"
indexmap = "2.11.3"
