[package]
name = "gen-models"
description = "Models for the gen sequence graph and version control system."
version = "0.2.0"
edition = "2024"
repository = "https://github.com/genhub-bio/gen"
homepage = "https://genhub.bio"
license = "Apache-2.0"
include = ["src", "migrations"]

[features]
benchmark = []
doltlite = []
default = ["doltlite"]

[dev-dependencies]
rand = "0.10.1"
tempfile = "3.20.0"

[dependencies]
gen-capnp-schemas = { path = "../gen-capnp-schemas", version = "0.2.0" }
gen-core = { path = "../gen-core", version = "0.2.0" }
gen-graph = { path = "../gen-graph", version = "0.2.0" }
cached = "0.55.1"
capnp = { version = "0.24" }
include_dir = "0.7.4"
chrono = "0.4.40"
fallible-streaming-iterator = "0.1.9"
intervaltree = "0.2.7"
itertools = "0.14.0"
noodles = { version = "0.101.0", features = ["async", "bed", "bgzf", "core", "fasta", "gff", "gtf", "tabix", "vcf"] }
opendal = { version = "0.56", features = ["blocking", "services-fs", "services-http", "services-s3", "services-gcs", "services-azblob"] }
petgraph = "0.6.5"
rusqlite = { path = "../gen-doltlite-rs", version = "0.32.1", features = ["bundled", "array", "limits", "session", "fallible_uint"] }
rusqlite_migration = { version = "1.3.1" , features = ["from-directory"]}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
tokio = { version = "1.52.1", features = ["rt-multi-thread"] }
url = "2.5.0"
indexmap = "2.11.3"
anyhow = "1.0.100"
