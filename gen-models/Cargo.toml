[package]
name = "gen-models"
description = "Models for the gen sequence graph and version control system."
version = "0.2.1"
edition = "2024"
repository = "https://github.com/genhub-bio/gen"
homepage = "https://genhub.bio"
license = "Apache-2.0"
include = ["src", "migrations"]

[features]
benchmark = []
profiling = ["dep:tracing"]

[dev-dependencies]
rand = "0.10.1"

[dependencies]
gen-capnp-schemas = { path = "../gen-capnp-schemas", version = "0.2.1" }
gen-core = { path = "../gen-core", version = "0.2.1" }
gen-graph = { path = "../gen-graph", version = "0.2.1" }
cached = "0.55.1"
capnp = { version = "0.24" }
include_dir = "0.7.4"
chrono = "0.4.40"
fallible-streaming-iterator = "0.1.9"
intervaltree = "0.2.7"
itertools = "0.14.0"
noodles = { version = "0.101.0", features = ["async", "bed", "bgzf", "core", "fasta", "gff", "gtf", "tabix", "vcf"] }
opendal = { version = "0.56", features = ["blocking", "services-fs", "services-http", "services-s3", "services-gcs", "services-azblob"] }
petgraph = "0.6.5"
rusqlite = { package = "rusqdoltlite", version = "0.40.14", features = ["bundled", "array", "limits", "fallible_uint", "backup"] }
rusqlite_migration = { package = "rusqdoltlite_migration", version = "2.6.4" , features = ["from-directory"]}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
sha2 = "0.10.8"
thiserror = "2.0.12"
tokio = { version = "1.52.1", features = ["rt-multi-thread"] }
tempfile = "3.20.0"
url = "2.5.0"
indexmap = "2.11.3"
anyhow = "1.0.100"
tracing = { version = "0.1.41", optional = true }
