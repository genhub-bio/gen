[package]
name = "gen-models"
description = "Models for the gen sequence graph and version control system."
version = "0.1.31"
edition = "2024"
repository = "https://github.com/genhub-bio/gen"
homepage = "https://genhub.bio"
license = "Apache-2.0"
include = ["src", "migrations"]

[features]
default = ["remote-assets", "sqlite-session"]
benchmark = []
remote-assets = ["dep:opendal", "dep:tokio", "opendal/services-http", "opendal/services-s3", "opendal/services-gcs", "opendal/services-azblob"]
sqlite-session = ["rusqlite/session"]

[dev-dependencies]
rand = "0.10.1"
tempfile = "3.20.0"

[dependencies]
gen-capnp-schemas = { path = "../gen-capnp-schemas", version = "0.1.31" }
gen-core = { path = "../gen-core", version = "0.1.31" }
gen-graph = { path = "../gen-graph", version = "0.1.31" }
cached = "0.55.1"
capnp = { version = "0.24" }
include_dir = "0.7.4"
chrono = "0.4.40"
fallible-streaming-iterator = "0.1.9"
intervaltree = "0.2.7"
itertools = "0.14.0"
noodles = { version = "0.101.0", features = ["bed", "bgzf", "core", "fasta", "gff", "gtf", "tabix", "vcf"] }
opendal = { version = "0.56", default-features = false, features = ["blocking", "services-fs"], optional = true }
petgraph = "0.6.5"
rusqlite = { version = "0.32.1", features = ["bundled", "array", "limits"] }
rusqlite_migration = { version = "1.3.1" , features = ["from-directory"]}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
tokio = { version = "1.52.1", features = ["rt-multi-thread"], optional = true }
url = "2.5.0"
indexmap = "2.11.3"
anyhow = "1.0.100"
