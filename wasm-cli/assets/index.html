<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>gen wasm demo</title>
  <script src="bundle.js"></script>
</head>
<body>
  <div id="intro-bar">
    <p>
      This is a terminal providing the <code>gen</code> command along with a few core utilities
      like <code>cd</code>, <code>ls</code>, and friends. Run
      <a id="help-link" href="#"><code>gen --help</code></a> to see which subcommands are
      available.
      <br />
      <span id="intro-note">Everything runs locally on your own machine, so push to a GenHub
      repository to have your changes stored online too.</span>
    </p>
    <label id="theme-toggle" class="theme-toggle" for="theme-toggle-input">
      <input type="checkbox" id="theme-toggle-input" aria-label="Toggle light or dark theme" />
      <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
    </label>
  </div>
  <div id="upload-bar">
    <label for="upload-input">Add a file:</label>
    <input type="file" id="upload-input" />
    <span id="upload-status"></span>
  </div>
  <div id="terminal-wrap">
    <div id="targetdiv"></div>
  </div>
</body>
</html>
