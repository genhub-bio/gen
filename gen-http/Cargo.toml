[package]
name = "gen-http"
version = "0.5.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
http = "1.3.1"
serde_json = "1.0.140"
thiserror = "2.0.12"

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls"] }

[build-dependencies]
cc = "1.2"
