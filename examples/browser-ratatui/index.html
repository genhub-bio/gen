<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gen Ratatui Browser Demo</title>
    <style>
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #0b0f14;
      }

      #terminal {
        box-sizing: border-box;
        height: 100vh;
        min-height: 320px;
        min-width: 320px;
        width: 100vw;
      }

      #terminal .xterm {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="terminal" tabindex="0"></div>
    <script type="module">
      import "@xterm/xterm/css/xterm.css";
      import { Terminal } from "@xterm/xterm";
      import { FitAddon } from "@xterm/addon-fit";
      import wasmerWasmUrl from "@wasmer/sdk/wasm?url";

      async function main() {
        const term = new Terminal({
          cursorBlink: true,
          convertEol: true,
          fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
          fontSize: 13,
        });
        const fit = new FitAddon();
        term.loadAddon(fit);
        const terminalElement = document.getElementById("terminal");
        term.open(terminalElement);
        terminalElement.addEventListener("pointerdown", () => term.focus());
        fit.fit();
        term.focus();
        term.writeln("Loading Wasmer runtime...");

        const { init, Directory, runWasix } = await import("@wasmer/sdk");
        await init({
          module: new URL(wasmerWasmUrl, window.location.href),
          registryUrl: null,
        });
        term.writeln("Loading gen.wasm...");

        const workspace = new Directory({
          "/plasmid.fa": ">plasmid\nATGCGTACGTAGCTAGCTAGGATCCGCTAGCTAGCTAACGTTAGC\n",
          "/plasmid_mut.fa": ">plasmid\nATGCGTACGTAGCTAGCTAGGATCCGCTAGCTAGCTAACGTTTGC\n",
          "/feature.gff3": "##gff-version 3\nplasmid\tdemo\tgene\t1\t12\t.\t+\t.\tID=demo_gene;Name=Demo gene\n",
        });

        const wasmResponse = await fetch("./gen.wasm");
        if (!wasmResponse.ok) {
          throw new Error(`Failed to fetch gen.wasm: HTTP ${wasmResponse.status}`);
        }
        const encoder = new TextEncoder();
        const wasm = await WebAssembly.compileStreaming(wasmResponse);
        let activeStdin = null;
        let inputBuffer = "";
        let inputCursor = 0;
        const promptText = "/workspace $ ";
        const commandHistory = [];
        let historyIndex = null;

        function env() {
          return {
            TERM: "xterm-256color",
            COLORTERM: "truecolor",
            GEN_BROWSER: "1",
            GEN_TUI_COLS: String(term.cols),
            GEN_TUI_ROWS: String(term.rows),
          };
        }

        function prompt() {
          term.write(`\r\n${promptText}`);
        }

        function redrawPromptLine() {
          term.write(`\r\x1b[2K${promptText}${inputBuffer}`);
          const charsAfterCursor = inputBuffer.length - inputCursor;
          if (charsAfterCursor > 0) {
            term.write(`\x1b[${charsAfterCursor}D`);
          }
        }

        function recordHistory(line) {
          const command = line.trim();
          if (command.length === 0) {
            return;
          }
          if (commandHistory[commandHistory.length - 1] !== command) {
            commandHistory.push(command);
          }
          historyIndex = null;
        }

        function recallHistory(direction) {
          if (commandHistory.length === 0) {
            return;
          }

          if (historyIndex === null) {
            historyIndex = direction < 0 ? commandHistory.length - 1 : commandHistory.length;
          } else {
            historyIndex += direction;
          }

          if (historyIndex < 0) {
            historyIndex = 0;
          }
          if (historyIndex >= commandHistory.length) {
            historyIndex = null;
            inputBuffer = "";
          } else {
            inputBuffer = commandHistory[historyIndex];
          }
          inputCursor = inputBuffer.length;
          redrawPromptLine();
        }

        function moveInputCursor(delta) {
          const nextCursor = Math.max(0, Math.min(inputBuffer.length, inputCursor + delta));
          if (nextCursor === inputCursor) {
            return;
          }
          term.write(delta < 0 ? "\x1b[D" : "\x1b[C");
          inputCursor = nextCursor;
        }

        function insertInputText(text) {
          inputBuffer =
            inputBuffer.slice(0, inputCursor) + text + inputBuffer.slice(inputCursor);
          inputCursor += text.length;
          historyIndex = null;
          redrawPromptLine();
        }

        function deleteBeforeCursor() {
          if (inputCursor === 0) {
            return;
          }
          inputBuffer =
            inputBuffer.slice(0, inputCursor - 1) + inputBuffer.slice(inputCursor);
          inputCursor -= 1;
          historyIndex = null;
          redrawPromptLine();
        }

        function workspacePath(path = ".") {
          if (path === "." || path === "/workspace") {
            return "/";
          }
          if (path.startsWith("/workspace/")) {
            return `/${path.slice("/workspace/".length)}`;
          }
          if (path.startsWith("/")) {
            return path;
          }
          return `/${path}`;
        }

        function parseCommand(line) {
          const args = [];
          let current = "";
          let quote = null;
          let escaping = false;
          for (const char of line.trim()) {
            if (escaping) {
              current += char;
              escaping = false;
            } else if (char === "\\") {
              escaping = true;
            } else if (quote) {
              if (char === quote) {
                quote = null;
              } else {
                current += char;
              }
            } else if (char === "'" || char === '"') {
              quote = char;
            } else if (/\s/.test(char)) {
              if (current.length > 0) {
                args.push(current);
                current = "";
              }
            } else {
              current += char;
            }
          }
          if (current.length > 0) {
            args.push(current);
          }
          return args;
        }

        async function runGen(args, { interactive = true } = {}) {
          const instance = await runWasix(wasm, {
            program: "gen",
            args,
            env: env(),
            cwd: "/workspace",
            mount: {
              "/workspace": workspace,
            },
          });

          const stdin = instance.stdin?.getWriter();
          if (interactive) {
            activeStdin = stdin;
          }

          const writeOutput = (chunk) => term.write(chunk);
          const stdoutDone = instance.stdout?.pipeTo(new WritableStream({ write: writeOutput }));
          const stderrDone = instance.stderr?.pipeTo(new WritableStream({ write: writeOutput }));
          const result = await instance.wait();
          await Promise.allSettled([stdoutDone, stderrDone]);

          if (interactive) {
            activeStdin = null;
          }
          if (!result.ok) {
            term.writeln(`\r\ngen exited with code ${result.code}`);
          }
          return result;
        }

        async function runShellCommand(line) {
          const args = parseCommand(line);
          if (args.length === 0) {
            prompt();
            return;
          }

          const [command, ...rest] = args;
          if (command === "clear") {
            term.clear();
            prompt();
            return;
          }
          if (command === "help") {
            term.writeln("\r\nCommands:");
            term.writeln("  ls [path]                    list files in /workspace");
            term.writeln("  cat <file>                   print a workspace file");
            term.writeln("  gen                         show Gen help");
            term.writeln("  gen view plasmid --sample reference --full");
            term.writeln("  gen update sequence TTT --region-name plasmid:1-3 --new-sample edited");
            term.writeln("  gen browser-demo-tui        open the demo TUI directly");
            term.writeln("  clear");
            prompt();
            return;
          }
          if (command === "ls") {
            const path = workspacePath(rest[0]);
            try {
              const entries = await workspace.readDir(path);
              const names = entries
                .map((entry) => `${entry.name}${entry.type === "dir" ? "/" : ""}`)
                .sort();
              term.writeln(`\r\n${names.join("  ")}`);
            } catch (error) {
              term.writeln(`\r\nls: ${rest[0] ?? "."}: ${error?.message ?? error}`);
            }
            prompt();
            return;
          }
          if (command === "cat") {
            if (rest.length === 0) {
              term.writeln("\r\ncat: missing file operand");
              prompt();
              return;
            }
            try {
              const text = await workspace.readTextFile(workspacePath(rest[0]));
              term.write(`\r\n${text.replaceAll("\n", "\r\n")}`);
            } catch (error) {
              term.writeln(`\r\ncat: ${rest[0]}: ${error?.message ?? error}`);
            }
            prompt();
            return;
          }
          if (command !== "gen") {
            term.writeln(`\r\nUnknown command: ${command}`);
            term.writeln("Try: help");
            prompt();
            return;
          }

          term.write("\r\n");
          await runGen(rest);
          prompt();
        }

        term.onData((data) => {
          if (activeStdin) {
            activeStdin.write(encoder.encode(data));
            return;
          }

          if (data === "\x1b[A") {
            recallHistory(-1);
            return;
          }
          if (data === "\x1b[B") {
            recallHistory(1);
            return;
          }
          if (data === "\x1b[D") {
            moveInputCursor(-1);
            return;
          }
          if (data === "\x1b[C") {
            moveInputCursor(1);
            return;
          }

          for (const char of data) {
            if (char === "\r") {
              const line = inputBuffer;
              inputBuffer = "";
              inputCursor = 0;
              recordHistory(line);
              runShellCommand(line).catch((error) => {
                term.writeln(`\r\n${error?.stack ?? error}`);
                prompt();
              });
            } else if (char === "\u007f") {
              deleteBeforeCursor();
            } else if (char === "\u0003") {
              inputBuffer = "";
              inputCursor = 0;
              historyIndex = null;
              term.write("^C");
              prompt();
            } else if (char >= " ") {
              insertInputText(char);
            }
          }
        });

        function sendResize() {
          fit.fit();
          activeStdin?.write(encoder.encode(`\x1b]777;resize;${term.cols};${term.rows}\x07`));
        }

        const resizeObserver = new ResizeObserver(sendResize);
        resizeObserver.observe(terminalElement);
        window.addEventListener("resize", sendResize);
        requestAnimationFrame(sendResize);
        requestAnimationFrame(() => term.focus());

        term.writeln("Preparing demo workspace...");
        await runGen(["browser-demo-setup"], { interactive: false });
        term.writeln("Ready. Try: gen view plasmid --sample reference --full");
        prompt();
      }

      main().catch((error) => {
        console.error(error);
        const terminalElement = document.getElementById("terminal");
        terminalElement.textContent = `Browser Ratatui demo failed:\n${error?.stack ?? error}`;
      });
    </script>
  </body>
</html>
