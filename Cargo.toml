[package]
name = "gen"
description = "A sequence graph and version control system."
version = "0.5.1"
edition = "2024"
repository = "https://github.com/genhub-bio/gen"
homepage = "https://genhub.bio"
license = "Apache-2.0"
include = [
  "/theme",
  "/src",
  "/tests/support/fake_gcs.rs",
  "/LICENSE",
]

[lib]
name = "gen"
path = "src/lib.rs"

[[bin]]
name = "gen"
path = "src/main.rs"
required-features = ["cli"]

[workspace]
members = [".", "gen-core", "gen-models", "gen-models-macros", "gen-models-macros/tests/fixture", "gen-graph", "gen-diff", "gen-tui", "gen-sugiyama", "gen-annotations", "gen-capnp-schemas", "gen-http"]
default-members = [".", "gen-core", "gen-models", "gen-models-macros", "gen-models-macros/tests/fixture", "gen-graph", "gen-diff", "gen-capnp-schemas", "gen-annotations", "gen-http"]
exclude = ["gen-python", "gen-r/src/rust"]

[features]
benchmark = []
default = ["models", "cli", "diff", "remote-native"]
diff = []
models = []
cli = [
    "dep:crossterm",
    "gen-tui/crossterm",
    "ratatui/crossterm",
    "dep:rat-cursor",
    "dep:rat-text",
    "dep:tui-widget-list",
]
remote = ["dep:gen-http", "dep:reqwest", "dep:webbrowser", "rusqlite/remote"]
remote-native = ["remote", "rusqlite/blockcachevfs"]
browser-cloud = ["remote", "rusqlite/browser-cloud"]
profiling = ["gen-models/profiling", "dep:tracing", "dep:tracing-subscriber", "dep:pprof"]

[dependencies]
gen-core = { path = "gen-core", version = "0.5.1" }
gen-diff = { path = "gen-diff", version = "0.5.1" }
gen-models = { path = "gen-models", version = "0.5.1" }
gen-graph = { path = "gen-graph", version = "0.5.1" }
gen-tui = { path = "gen-tui", version = "0.5.1", default-features = false }
gen-annotations = { path = "gen-annotations", version = "0.5.1" }
gai = { package = "genomic-attribute-index", version = "0.2.6" }
gen-capnp-schemas = { path = "gen-capnp-schemas", version = "0.5.1" }
gen-http = { path = "gen-http", version = "0.5.1", optional = true }
clap = { version = "4.5.32", features = ["derive"] }
chrono = { version = "0.4.40", features = ["serde"] }
convert_case = "0.8.0"
csv = "1.3.1"
fallible-streaming-iterator = "0.1.9"
include_dir = "0.7.4"
intervaltree = "0.2.7"
itertools = "0.14.0"
noodles = { version = "0.101.0", features = ["bed", "bgzf", "core", "csi", "fasta", "gff", "gtf", "vcf"] }
petgraph = "0.6.5"
rusqlite = { package = "rusqdoltlite", version = "0.41.2", features = ["bundled", "array", "limits", "fallible_uint", "backup"] }
rusqlite_migration = { package = "rusqdoltlite_migration", version = "2.7.0", features = ["from-directory"] }
serde = {  version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
tempfile = "3.20.0"
interavl = "0.3.0"
regex = "1.11.1"
flate2 = "1.1.0"
gb-io = "0.9.0"
thiserror = "2.0.12"
indicatif = "0.18.3"
html-escape = "0.2.13"
ratatui = { version = "0.30.0", default-features = false, features = ["all-widgets", "layout-cache", "macros", "std", "underline-color", "unstable-rendered-line-info"] }
crossterm = { version = "0.29.0", optional = true }
rat-cursor = { version = "2.0.0", optional = true }
rat-text = { version = "3.0.3", optional = true }
tui-widget-list = { version = "0.15.0", optional = true }
log = "0.4.26"
env_logger = "0.11.7"
url-parse = "1.0.10"
url = "2.5.0"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
once_cell = "1.21.3"
rand = "0.10.1"
base64 = "0.22.1"
crc32c = "0.6.8"
md-5 = "0.10.6"
getrandom = "0.3.3"
directories = "6.0.0"
httparse = "1.10.1"
capnp = "0.24"
indexmap = "2.11.3"
anyhow = { version = "1.0.100", features = ["backtrace"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
zip = "9.0.2"
tracing = { version = "0.1.41", optional = true }
tracing-subscriber = { version = "0.3.19", features = ["registry"], optional = true }
pprof = { version = "0.15.0", optional = true }

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
noodles = { version = "0.101.0", features = ["async"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "multipart", "stream", "rustls-tls"], optional = true }
webbrowser = { version = "1.0.5", optional = true }

[dev-dependencies]
cargo-llvm-cov = "0.9.0"
more-asserts = "0.3.1"
insta = "1.43.1"
rusqlite = { package = "rusqdoltlite", version = "0.41.2", features = ["remote"] }

[profile.release]
opt-level = "s"
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
rusqdoltlite = { git = "https://github.com/Chris7/rusqdoltlite.git", rev = "9c388d4ad69722792f659ebe764d631e602b74e3" }
