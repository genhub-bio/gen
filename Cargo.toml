[package]
name = "gen"
description = "A sequence graph and version control system."
version = "0.1.0"
edition = "2024"
repository = "https://github.com/ginkgobioworks/gen"
homepage = "https://genhub.bio"
license = "Apache-2.0"
include = ["/src", "LICENSE", "migrations"]

[lib]
name = "gen"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gen"
path = "src/main.rs"

[workspace]
members = ["gen-core", "gen-models", "gen-graph", "gen-python"]

[features]
benchmark = []
python-bindings = ["pyo3", "pyo3-macros", "rustworkx-core", "gen-core/python-bindings"]
extension-module = ["pyo3/extension-module"]
default = ["models", "cli"]
models = []
cli = []

[dependencies]
gen-core = { path = "gen-core" }
gen-models = { path = "gen-models" }
gen-graph = { path = "gen-graph" }
clap = { version = "4.5.32", features = ["derive"] }
clap-nested-commands = "0.0.6"
convert_case = "0.8.0"
csv = "1.3.1"
fallible-streaming-iterator = "0.1.9"
include_dir = "0.7.4"
intervaltree = "0.2.7"
itertools = "0.14.0"
noodles = { version = "0.94.0", features = ["async", "bed", "bgzf", "core", "fasta", "gff", "gtf", "vcf"] }
petgraph = "0.6.5"
rusqlite = { version = "0.32.1", features = ["bundled", "array", "session"] }
rusqlite_migration = { version = "1.3.1" , features = ["from-directory"]}
serde = {  version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
tempfile = "3.20.0"
interavl = "0.3.0"
regex = "1.11.1"
flate2 = "1.1.0"
gb-io = "0.8.0"
thiserror = "2.0.12"
indicatif = "0.17.11"
html-escape = "0.2.13"
rust-sugiyama = {git = "https://github.com/paddison/rust-sugiyama", rev = "4d15b35124adac1de3a3b2cc42af8d68290935f2" }
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
crossterm = "0.28.1"
log = "0.4.26"
env_logger = "0.11.7"
tui-textarea = "0.7.0"
tui-widget-list = "0.13.2"
paste = "1.0.15"
url-parse = "1.0.10"
url = "2.5.0"
ratatui-base16 = "0.3.7"
once_cell = "1.21.3"
pyo3 = { version = "0.25.1", optional = true }
pyo3-macros = { version = "0.25.1", optional = true }
rustworkx-core = { version = "0.16.0", optional = true }
webbrowser = "1.0.5"
reqwest = { version = "0.12.23", default-features = false,features = ["blocking", "json", "multipart", "stream", "rustls-tls"] }
rand = "0.9.2"
base64 = "0.22.1"
getrandom = "0.3.3"
directories = "6.0.0"
httparse = "1.10.1"
capnp = "0.21.5"
indexmap = "2.11.3"

[build-dependencies]
capnpc = "0.21.4"

[dev-dependencies]
cargo-llvm-cov = "0.6.16"
cargo-deny = "0.18.3"
more-asserts = "0.3.1"

[profile.release]
opt-level = "s"
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
