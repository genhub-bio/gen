[package]
name = "gen"
description = "A sequence graph and version control system."
version = "0.1.21"
edition = "2024"
repository = "https://github.com/ginkgobioworks/gen"
homepage = "https://genhub.bio"
license = "Apache-2.0"
include = ["/src", "LICENSE", "migrations"]

[lib]
name = "gen"
path = "src/lib.rs"

[[bin]]
name = "gen"
path = "src/main.rs"

[workspace]
members = [".", "gen-core", "gen-models", "gen-graph", "gen-diff", "gen-tui", "gen-sugiyama", "gen-annotations"]
default-members = [".", "gen-core", "gen-models", "gen-graph", "gen-diff"]
exclude = ["gen-python"]

[features]
benchmark = []
default = ["models", "cli", "diff"]
diff = []
models = []
cli = []

[dependencies]
gen-core = { path = "gen-core" }
gen-diff = { path = "gen-diff" }
gen-models = { path = "gen-models" }
gen-graph = { path = "gen-graph" }
gen-tui = { path = "gen-tui" }
gen-annotations = { path = "gen-annotations" }
clap = { version = "4.5.32", features = ["derive"] }
clap-nested-commands = "0.0.6"
convert_case = "0.8.0"
csv = "1.3.1"
fallible-streaming-iterator = "0.1.9"
include_dir = "0.7.4"
intervaltree = "0.2.7"
itertools = "0.14.0"
noodles = { version = "0.101.0", features = ["async", "bed", "bgzf", "core", "fasta", "gff", "gtf", "vcf"] }
petgraph = "0.6.5"
rusqlite = { version = "0.32.1", features = ["bundled", "array", "limits", "session"] }
rusqlite_migration = { version = "1.3.1" , features = ["from-directory"]}
serde = {  version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
tempfile = "3.20.0"
interavl = "0.3.0"
regex = "1.11.1"
flate2 = "1.1.0"
gb-io = "0.8.0"
thiserror = "2.0.12"
indicatif = "0.18.3"
html-escape = "0.2.13"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"
log = "0.4.26"
env_logger = "0.11.7"
rat-text = "3.0.3"
rat-cursor = "2.0.0"
tui-widget-list = "0.15.0"
paste = "1.0.15"
url-parse = "1.0.10"
url = "2.5.0"
figment = { version = "0.10", features = ["yaml"] }
serde_with = "3.0"
once_cell = "1.21.3"
webbrowser = "1.0.5"
reqwest = { version = "0.12.23", default-features = false,features = ["blocking", "json", "multipart", "stream", "rustls-tls"] }
rand = "0.9.2"
base64 = "0.22.1"
getrandom = "0.3.3"
directories = "6.0.0"
httparse = "1.10.1"
capnp = "0.24"
indexmap = "2.11.3"
anyhow = { version = "1.0.100", features = ["backtrace"] }

[build-dependencies]
capnpc = "0.24"

[dev-dependencies]
cargo-llvm-cov = "0.6.16"
cargo-deny = "0.18.5"
more-asserts = "0.3.1"

[profile.release]
opt-level = "s"
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
