[package]
edition = "2024"
name = "gen"
version = "0.1.30"
include = [
    "/src",
    "/LICENSE",
]
description = "A sequence graph and version control system."
homepage = "https://genhub.bio"
license = "Apache-2.0"
repository = "https://github.com/genhub-bio/gen"

[features]
benchmark = []
cli = []
default = [
    "models",
    "cli",
    "diff",
]
diff = []
models = []

[lib]
name = "gen"
path = "src/lib.rs"

[[bin]]
name = "gen"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
capnp = "0.24"
convert_case = "0.8.0"
crossterm = "0.29.0"
csv = "1.3.1"
directories = "6.0.0"
env_logger = "0.11.7"
fallible-streaming-iterator = "0.1.9"
flate2 = "1.1.0"
gb-io = "0.8.0"
getrandom = "0.3.3"
html-escape = "0.2.13"
httparse = "1.10.1"
include_dir = "0.7.4"
indexmap = "2.11.3"
indicatif = "0.18.3"
interavl = "0.3.0"
intervaltree = "0.2.7"
itertools = "0.14.0"
log = "0.4.26"
once_cell = "1.21.3"
petgraph = "0.6.5"
rand = "0.9.2"
rat-cursor = "2.0.0"
rat-text = "3.0.3"
regex = "1.11.1"
serde_json = "1.0.140"
serde_with = "3.0"
sha2 = "0.10.8"
tempfile = "3.20.0"
thiserror = "2.0.12"
tui-widget-list = "0.15.0"
url = "2.5.0"
url-parse = "1.0.10"
webbrowser = "1.0.5"

[dependencies.anyhow]
version = "1.0.100"
features = ["backtrace"]

[dependencies.clap]
version = "4.5.32"
features = ["derive"]

[dependencies.figment]
version = "0.10"
features = ["yaml"]

[dependencies.gen-annotations]
version = "0.1.30"
path = "gen-annotations"

[dependencies.gen-capnp-schemas]
version = "0.1.30"
path = "gen-capnp-schemas"

[dependencies.gen-core]
version = "0.1.30"
path = "gen-core"

[dependencies.gen-diff]
version = "0.1.30"
path = "gen-diff"

[dependencies.gen-graph]
version = "0.1.30"
path = "gen-graph"

[dependencies.gen-models]
version = "0.1.30"
path = "gen-models"

[dependencies.gen-tui]
version = "0.1.30"
path = "gen-tui"

[dependencies.noodles]
version = "0.101.0"
features = [
    "async",
    "bed",
    "bgzf",
    "core",
    "fasta",
    "gff",
    "gtf",
    "vcf",
]

[dependencies.ratatui]
version = "0.30.0"
features = ["unstable-rendered-line-info"]

[dependencies.reqwest]
version = "0.12.23"
features = [
    "blocking",
    "json",
    "multipart",
    "stream",
    "rustls-tls",
]
default-features = false

[dependencies.rusqlite]
version = "0.32.1"
features = [
    "bundled",
    "array",
    "limits",
    "session",
]

[dependencies.rusqlite_migration]
version = "1.3.1"
features = ["from-directory"]

[dependencies.serde]
version = "1.0.219"
features = ["derive"]

[dev-dependencies]
cargo-deny = "0.18.5"
cargo-llvm-cov = "0.6.16"
more-asserts = "0.3.1"

[workspace]
members = [
    ".",
    "gen-annotations",
    "gen-capnp-schemas",
    "gen-core",
    "gen-diff",
    "gen-graph",
    "gen-models",
    "gen-sugiyama",
    "gen-tui",
]
exclude = ["gen-python", "gen-tui-wasm"]
default-members = [
    ".",
    "gen-core",
    "gen-models",
    "gen-graph",
    "gen-diff",
    "gen-capnp-schemas",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
