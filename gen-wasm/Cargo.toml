[package]
name = "gen-browser-actions"
version = "0.5.1"
edition = "2024"
publish = false

[lib]
name = "gen_browser_actions"
crate-type = ["rlib"]

[[bin]]
name = "gen_browser_actions"
path = "src/main.rs"

[dependencies]
gen = { path = "..", default-features = false, features = ["browser-cloud", "diff", "models"] }
gen-core = { path = "../gen-core" }
gen-models = { path = "../gen-models" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
url = "2.5.0"

[dev-dependencies]
tempfile = "3.20.0"
