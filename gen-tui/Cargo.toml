[package]
name = "gen-tui"
description = "Graph visualization widget system for Gen"
version = "0.2.1"
edition = "2024"
repository = "https://github.com/genhub-bio/gen"
homepage = "https://genhub.bio"
license = "Apache-2.0"

[dependencies]
rust-sugiyama = { git = "https://github.com/bobvh/rust-sugiyama", rev = "3428ae4a47fdfa51414faee25484bfb4130621f0" }
itertools = "0.14.0"
petgraph = { version = "0.6.5", features = ["serde-1"] }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
log = "0.4.26"
ratatui = { version = "0.30.0", default-features = false, features = ["unstable-rendered-line-info", "std", "underline-color", "macros", "layout-cache"] }
crossterm = { version = "0.29.0", optional = true }


[features]
default = ["crossterm"]
crossterm = ["dep:crossterm"]

[dev-dependencies]
insta = "1.43.1"
ratatui = { version = "0.30.0", features = ["crossterm"] }
env_logger = "0.10.0"
more-asserts = "0.3.1"
