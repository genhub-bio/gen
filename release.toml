shared-version = true
allow-branch = ["main"]
push-remote = "origin"
tag-message = "Release {{tag_name}}"
consolidate-commits = true
publish = false

pre-release-replacements = [
  { file = "pyproject.toml", search = '^version = ".*"$', replace = 'version = "{{version}}"', exactly = 1 },
  { file = "gen-python/Cargo.toml", search = '^version = ".*"$', replace = 'version = "{{version}}"', exactly = 1 },
  { file = "gen-python/python/gen/__init__.py", search = '__version__ = ".*"$', replace = '__version__ = "{{version}}"', exactly = 1 }
]

pre-release-hook = ["cargo", "generate-lockfile", "--manifest-path", "gen-python/Cargo.toml"]
