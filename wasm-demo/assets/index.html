<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>gen wasm demo</title>
  <script src="bundle.js"></script>
</head>
<body>
  <div id="intro-bar">
    <p>
      This is a terminal running on your machine, providing the <code>gen</code> command along with
      a few core utilities like <code>cd</code>, <code>ls</code>, and friends. Run
      <a id="help-link" href="#"><code>gen --help</code></a> to see what's available.
    </p>
    <p id="intro-note">
      Push to a GenHub repository to have your changes stored on GenHub too.
    </p>
  </div>
  <div id="upload-bar">
    <label for="upload-input">Add a file to /drive:</label>
    <input type="file" id="upload-input" />
    <span id="upload-status"></span>
  </div>
  <div id="terminal-wrap">
    <div id="targetdiv"></div>
  </div>
</body>
</html>
