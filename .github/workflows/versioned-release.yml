name: Versioned Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        required: true
        type: choice
        description: "The semver bump level"
        options:
          - "patch"
          - "minor"
          - "major"
        default: "patch"

jobs:
  versioned-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run cargo-release (workspace + python)
        env:
          CARGO_TERM_COLOR: always
        run: |
          cargo release ${{ github.event.inputs.release_type }} \
            --workspace \
            --config release.toml \
            --execute \
            --skip-publish \
            --no-dev-version \
            --no-confirm

      - name: Capture new version
        id: version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="gen") | .version' | head -n1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate release tarball
        run: git archive --format=tar.gz -o "gen-${{ steps.version.outputs.version }}.tar.gz" --prefix=gen/ HEAD

      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: gen-release-tarball
          path: "gen-${{ steps.version.outputs.version }}.tar.gz"
