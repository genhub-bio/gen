name: Versioned Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        required: true
        type: choice
        description: "The semver bump level"
        options:
          - "patch"
          - "minor"
          - "major"
        default: "patch"

jobs:
  versioned-release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Versions
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          old_version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="gen") | .version' | head -n1)
          cargo set-version --manifest-path gen-python/Cargo.toml --bump "$RELEASE_TYPE"
          cargo set-version --manifest-path gen-r/src/rust/Cargo.toml --bump "$RELEASE_TYPE"
          cargo set-version -p gen-capnp-schemas -p gen-core -p gen-diff -p gen-graph -p gen-models -p gen-sugiyama -p gen-tui -p gen-annotations -p gen --bump "$RELEASE_TYPE"
          uv version --no-sync --bump "$RELEASE_TYPE"
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="gen") | .version' | head -n1)
          old_version_pattern=${old_version//./\\.}
          sed -E -i.bak "s/(gen(-[A-Za-z0-9_-]+)?[[:space:]]*=[[:space:]]*[{][^}]*version[[:space:]]*=[[:space:]]*\")${old_version_pattern}(\")/\\1${version}\\3/g" Cargo.toml gen-*/Cargo.toml gen-r/src/rust/Cargo.toml
          rm -f Cargo.toml.bak gen-*/Cargo.toml.bak gen-r/src/rust/Cargo.toml.bak
          cargo update -p gen-capnp-schemas -p gen-core -p gen-diff -p gen-graph -p gen-models -p gen-sugiyama -p gen-tui -p gen-annotations -p gen
          cargo update --manifest-path gen-python/Cargo.toml -p gen-capnp-schemas -p gen-core -p gen-diff -p gen-graph -p gen-models -p gen-sugiyama -p gen-tui -p gen-annotations -p gen
          cargo update --manifest-path gen-r/src/rust/Cargo.toml -p gen-capnp-schemas -p gen-core -p gen-diff -p gen-graph -p gen-models -p gen-sugiyama -p gen-tui -p gen

      - name: Capture new version
        id: version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="gen") | .version' | head -n1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sync gen-r package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          perl -0pi -e 's/^Version: .*/Version: '"$VERSION"'/m' gen-r/DESCRIPTION

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add Cargo.toml gen-models/Cargo.toml gen-diff/Cargo.toml gen-python/Cargo.toml gen-r/src/rust/Cargo.toml gen-r/DESCRIPTION gen-sugiyama/Cargo.toml gen-tui/Cargo.toml gen-annotations/Cargo.toml gen-core/Cargo.toml gen-capnp-schemas/Cargo.toml gen-graph/Cargo.toml pyproject.toml
          git add Cargo.lock gen-python/Cargo.lock gen-r/src/rust/Cargo.lock
          git commit -m "Release v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin HEAD
          git push origin "v${VERSION}"

      - name: Generate Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "gen ${VERSION}"

      - name: Upload binaries to releases
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref "v${VERSION}"

      - name: Trigger python wheels workflow on the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run python-wheels.yaml --ref "v${VERSION}"

      - name: Trigger crates.io publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-crates-io.yaml --ref "v${VERSION}" -f tag="v$VERSION"

      - name: Trigger R package release workflow on the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-r-packages-tag.yaml --ref "v${VERSION}" -f git_ref="v$VERSION" -f release_name="v$VERSION"
