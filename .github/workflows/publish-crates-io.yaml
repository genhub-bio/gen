name: Publish Crates.io Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (e.g. v0.4.0)
        required: true
        type: string
      dry-run:
        description: Run cargo publish in dry-run mode
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Verify tag matches crate version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="gen") | .version' | head -n1)
          tag="${{ inputs.tag }}"
          tag_stripped="${tag#v}"
          if [ "$version" != "$tag_stripped" ]; then
            echo "Tag version ($tag_stripped) does not match Cargo.toml version ($version)" >&2
            exit 1
          fi

      - name: Cargo publish (dry run)
        if: ${{ inputs.dry-run }}
        run: cargo publish --package gen --locked --dry-run

      - name: Cargo publish
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required" >&2
            exit 1
          fi
          cargo publish --package gen --locked
