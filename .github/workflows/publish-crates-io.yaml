name: Publish Crates.io Tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (e.g. v0.4.0)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: crates
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install capnp
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends capnproto

      - name: Verify tag matches crate version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="gen") | .version' | head -n1)
          tag="${{ inputs.tag }}"
          echo "Tag: $tag"
          tag_stripped="${tag#v}"
          echo "Tag stripped: $tag_stripped"
          if [ "$version" != "$tag_stripped" ]; then
            echo "Tag version ($tag_stripped) does not match Cargo.toml version ($version)" >&2
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
