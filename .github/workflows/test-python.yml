name: Test Python Bindings

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install capnproto clang mold
      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $capnpVerified = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install capnproto -y
            $installExitCode = $LASTEXITCODE

            if ($installExitCode -eq 0) {
              $capnpCommand = Get-Command capnp -ErrorAction SilentlyContinue
              if ($null -ne $capnpCommand) {
                capnp --version
                $versionExitCode = $LASTEXITCODE
                if ($versionExitCode -eq 0) {
                  $capnpVerified = $true
                  break
                }
                Write-Warning "capnp --version exited with code $versionExitCode on attempt $attempt."
              } else {
                Write-Warning "capnp was not found after installation attempt $attempt."
              }
            } else {
              Write-Warning "choco install exited with code $installExitCode on attempt $attempt."
            }

            if ($attempt -lt 3) {
              Start-Sleep -Seconds 5
            }
          }

          if (-not $capnpVerified) {
            throw "Could not install and verify capnproto after 3 attempts."
          }
          exit 0
      - name: Test
        working-directory: gen-python
        run: cargo test
