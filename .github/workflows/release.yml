name: Nightly Release

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  release-macos:
    runs-on: macos-latest
    permissions:
      actions: write
      contents: write

    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Install Dependencies
      run: brew install capnp
    - name: x86 toolchain
      run: |
        rustup target add x86_64-apple-darwin
    - name: Build
      run: |
        cargo build --release --target x86_64-apple-darwin
        cargo build --release --target aarch64-apple-darwin
        lipo -create -output ./gen target/aarch64-apple-darwin/release/gen target/x86_64-apple-darwin/release/gen
    - name: Code sign app
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_APP_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_APP_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_APP_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          /usr/bin/codesign --force --timestamp -s "$MACOS_CERTIFICATE_NAME" --options runtime ./gen -v
    - name: Build package file
      run: |
        mkdir gen-binary
        mv ./gen gen-binary
        mv gen-binary ./gen
        pkgbuild --root gen \
           --identifier bio.genhub.gen \
           --version "1.0.0" \
           --install-location /usr/local/bin \
           gen-unsigned.pkg
    - name: Sign package file
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_INSTALL_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_INSTALL_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_INSTALL_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain
        productsign --sign "MACOS_CERTIFICATE_NAME" gen-unsigned.pkg gen.macos.pkg
    - name: Notarize package file
        env:
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
              --apple-id "$PROD_MACOS_NOTARIZATION_APPLE_ID" \
              --team-id "$PROD_MACOS_NOTARIZATION_TEAM_ID" \
              --password "$PROD_MACOS_NOTARIZATION_PWD"
          xcrun notarytool submit "./gen.macos.pkg" --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple "./gen.macos.pkg"
    - name: upload-binary
      run: |
        find . -name "gen"
        gh release upload nightly gen.macos.pkg --clobber

  release-ubuntu:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends capnproto
    - name: arm toolchain
      run: |
        rustup target add aarch64-unknown-linux-gnu
        sudo apt install gcc-aarch64-linux-gnu
    - name: Build
      run: |
        RUSTFLAGS='-C target-feature=+crt-static' cargo build --release --target x86_64-unknown-linux-gnu --exclude gen-python --workspace
        RUSTFLAGS='-C target-feature=+crt-static' cargo build --release --target aarch64-unknown-linux-gnu --config target.aarch64-unknown-linux-gnu.linker=\"aarch64-linux-gnu-gcc\" --exclude gen-python --workspace
    - name: upload-binary
      run: |
        find -name gen
        zip -j gen.linux-x86_64.zip target/x86_64-unknown-linux-gnu/release/gen
        zip -j gen.linux-arm64.zip target/aarch64-unknown-linux-gnu/release/gen
        gh release upload nightly gen.linux-x86_64.zip --clobber
        gh release upload nightly gen.linux-arm64.zip --clobber

  update-release-source:
    runs-on: ubuntu-latest
    needs: [release-macos, release-ubuntu]
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set nightly tag to current head
        run: |
          git tag -f nightly HEAD
          git push -f origin nightly
