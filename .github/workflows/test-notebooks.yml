name: Test Notebooks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-notebooks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install capnproto
      - name: Set venv bin dir
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "VENV_BIN=.venv/Scripts" >> "$GITHUB_ENV"
          else
            echo "VENV_BIN=.venv/bin" >> "$GITHUB_ENV"
          fi
      - name: Build and install gen package
        run: |
          python -m venv .venv
          "$VENV_BIN/python" -m pip install maturin
          "$VENV_BIN/maturin" develop
      - name: Install notebook test dependencies
        run: $VENV_BIN/python -m pip install pytest nbmake anywidget traitlets
      - name: Test notebooks
        run: $VENV_BIN/pytest --nbmake --nbmake-timeout=120 .
