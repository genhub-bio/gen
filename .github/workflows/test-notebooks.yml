name: Test Notebooks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  test-notebooks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y capnproto clang mold
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install capnproto
      - name: Set venv bin dir
        if: runner.os == 'Linux'
        run: |
          echo "VENV_BIN=.venv/bin" >> "$GITHUB_ENV"
      - name: Set venv bin dir (Windows)
        if: runner.os == 'Windows'
        run: '"VENV_BIN=.venv/Scripts" >> $env:GITHUB_ENV'
      - name: Build and install gen package
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv
          "$VENV_BIN/python" -m pip install maturin
          "$VENV_BIN/maturin" develop
      - name: Build and install gen package (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          & "$env:VENV_BIN/python" -m pip install maturin
          & "$env:VENV_BIN/maturin" develop
      - name: Install notebook test dependencies
        if: runner.os == 'Linux'
        run: $VENV_BIN/python -m pip install pytest nbmake anywidget traitlets
      - name: Install notebook test dependencies (Windows)
        if: runner.os == 'Windows'
        run: '& "$env:VENV_BIN/python" -m pip install pytest nbmake anywidget traitlets'
      - name: Test notebooks
        if: runner.os == 'Linux'
        run: $VENV_BIN/pytest --nbmake --nbmake-timeout=120 .
      - name: Test notebooks (Windows)
        if: runner.os == 'Windows'
        run: '& "$env:VENV_BIN/pytest" --nbmake --nbmake-timeout=120 .'
