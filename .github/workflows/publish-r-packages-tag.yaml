name: Publish R Packages

on:
  push:
    tags:
      - "v*"
    branches:
      - gen-r
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to package (tag, branch, or SHA)
        required: false
        type: string
      release_name:
        description: Release tag to upload assets to; leave empty to store artifacts in Actions only
        required: false
        type: string

env:
  PACKAGE_REF: ${{ github.event.inputs.git_ref || github.ref_name }}
  RELEASE_NAME: ${{ github.event.inputs.release_name || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build-macos:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            asset_suffix: macos-x86_64
          - os: macos-14
            asset_suffix: macos-arm64

    steps:
      - name: Ensure ref provided
        run: |
          if [ -z "${{ env.PACKAGE_REF }}" ]; then
            echo "PACKAGE_REF is required." >&2
            exit 1
          fi

      - name: Checkout ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_REF }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system dependencies
        run: |
          brew install capnp llvm pkg-config
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install R package dependencies
        run: Rscript -e "install.packages('testthat', repos = 'https://cloud.r-project.org')"

      - name: Build macOS binary package
        run: R CMD INSTALL --build gen-r

      - name: Rename macOS binary asset
        run: |
          version=$(sed -n 's/^Version: //p' gen-r/DESCRIPTION)
          asset="genr_${version}-${{ matrix.asset_suffix }}.tgz"
          mv genr_*.tgz "$asset"
          echo "ASSET_NAME=$asset" >> "$GITHUB_ENV"

      - name: Smoke test macOS binary package
        run: |
          Rscript -e "install.packages(commandArgs(TRUE)[1], repos = NULL, type = 'mac.binary'); library(testthat); test_dir('gen-r/tests/testthat')" "$ASSET_NAME"

      - name: Upload macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Ensure release exists
        if: ${{ env.RELEASE_NAME != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ env.RELEASE_NAME }}" >/dev/null 2>&1 || \
            gh release create "${{ env.RELEASE_NAME }}" --notes "" || \
            gh release view "${{ env.RELEASE_NAME }}"

      - name: Upload macOS binary to release
        if: ${{ env.RELEASE_NAME != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.RELEASE_NAME }}" "${{ env.ASSET_NAME }}" --clobber

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Ensure ref provided
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ env.PACKAGE_REF }}")) {
            throw "PACKAGE_REF is required."
          }

      - name: Checkout ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_REF }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-rtools@v2

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system dependencies
        shell: pwsh
        run: |
          choco install llvm capnproto -y
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install R package dependencies
        shell: pwsh
        run: Rscript -e "install.packages('testthat', repos = 'https://cloud.r-project.org')"

      - name: Build Windows binary package
        shell: pwsh
        run: R CMD INSTALL --build gen-r

      - name: Rename Windows binary asset
        shell: pwsh
        run: |
          $version = (Select-String -Path gen-r/DESCRIPTION -Pattern '^Version: ' | Select-Object -First 1).ToString().Split(':')[1].Trim()
          $asset = "genr_${version}-windows-x86_64.zip"
          $pkg = Get-ChildItem -Path . -Filter "genr_*.zip" | Select-Object -First 1
          Move-Item $pkg.FullName $asset
          "ASSET_NAME=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke test Windows binary package
        shell: pwsh
        run: Rscript -e "install.packages(commandArgs(TRUE)[1], repos = NULL, type = 'win.binary'); library(testthat); test_dir('gen-r/tests/testthat')" $env:ASSET_NAME

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Ensure release exists
        if: ${{ env.RELEASE_NAME != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ env.RELEASE_NAME }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ env.RELEASE_NAME }}" --notes ""
          }

      - name: Upload Windows binary to release
        if: ${{ env.RELEASE_NAME != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.RELEASE_NAME }}" "$env:ASSET_NAME" --clobber
