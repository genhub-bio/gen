name: Publish R Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to package (tag, branch, or SHA)
        required: false
        type: string
      release_name:
        description: Release tag to upload assets to; leave empty to store artifacts in Actions only
        required: false
        type: string

env:
  PACKAGE_REF: ${{ github.event.inputs.git_ref || github.ref_name }}
  RELEASE_NAME: ${{ github.event.inputs.release_name || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build-macos:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset_suffix: macos-arm64
          - os: macos-15-intel
            asset_suffix: macos-x86_64

    steps:
      - name: Ensure ref provided
        run: |
          if [ -z "${{ env.PACKAGE_REF }}" ]; then
            echo "PACKAGE_REF is required." >&2
            exit 1
          fi

      - name: Checkout ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_REF }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system dependencies
        run: |
          brew install capnp

      - name: Install R package dependencies
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          Rscript -e "install.packages(c('remotes', 'testthat'), repos = 'https://cloud.r-project.org')"
          Rscript -e "remotes::install_github('keller-mark/anyhtmlwidget', upgrade = 'never')"

      - name: Build macOS binary package
        run: R CMD INSTALL --build gen-r

      - name: Rename macOS binary asset
        run: |
          version=$(sed -n 's/^Version: //p' gen-r/DESCRIPTION)
          asset="genr_${version}-${{ matrix.asset_suffix }}.tgz"
          mv genr_*.tgz "$asset"
          echo "ASSET_NAME=$asset" >> "$GITHUB_ENV"

      - name: Smoke test macOS binary package
        run: |
          Rscript -e "install.packages(commandArgs(TRUE)[1], repos = NULL, type = 'mac.binary'); library(testthat); test_dir('gen-r/tests/testthat')" "$ASSET_NAME"

      - name: Upload macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: genr-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Ensure release exists
        if: ${{ env.RELEASE_NAME != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ env.RELEASE_NAME }}" >/dev/null 2>&1 || \
            gh release create "${{ env.RELEASE_NAME }}" --notes "" || \
            gh release view "${{ env.RELEASE_NAME }}"

      - name: Upload macOS binary to release
        if: ${{ env.RELEASE_NAME != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.RELEASE_NAME }}" "${{ env.ASSET_NAME }}" --clobber

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Ensure ref provided
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ env.PACKAGE_REF }}")) {
            throw "PACKAGE_REF is required."
          }

      - name: Checkout ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_REF }}
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          windows-path-include-rtools: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-gnu

      - name: Install system dependencies
        shell: pwsh
        run: |
          choco install llvm capnproto -y
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install R package dependencies
        shell: pwsh
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          Rscript -e "install.packages(c('remotes', 'testthat'), repos = 'https://cloud.r-project.org')"
          Rscript -e "remotes::install_github('keller-mark/anyhtmlwidget', upgrade = 'never')"

      - name: Build Windows binary package
        shell: cmd
        run: |
          where R
          R --version
          R CMD INSTALL --build gen-r
          if errorlevel 1 (
            exit /b 1
          )

      - name: Debug built files
        shell: pwsh
        run: |
          Write-Host "PWD: $PWD"
          Get-ChildItem .
          if (Test-Path dist) { Get-ChildItem dist }

      - name: Capture built package path
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path . -Filter 'genr_*.zip' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $pkg) {
            throw "Could not find built package matching genr_*.zip in $PWD"
          }

          if ($pkg.Name -notmatch '^genr_(.+)\.zip$') {
            throw "Built package name did not match expected pattern: $($pkg.Name)"
          }

          $version = $matches[1]

          "GENR_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GENR_PKG=$($pkg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Version: $version"
          Write-Host "Built package: $($pkg.FullName)"

      - name: Smoke test Windows binary package
        shell: pwsh
        run: |
          if (-not (Test-Path $env:GENR_PKG)) {
            throw "Missing built package: $env:GENR_PKG"
          }

          Rscript -e "install.packages(commandArgs(TRUE)[1], repos = NULL, type = 'win.binary'); library(testthat); testthat::test_dir('gen-r/tests/testthat')" $env:GENR_PKG

      - name: Prepare renamed artifact
        shell: pwsh
        run: |
          if (-not (Test-Path $env:GENR_PKG)) {
            throw "Missing built package before artifact prep: $env:GENR_PKG"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asset = Join-Path (Resolve-Path dist) ("genr-windows-{0}.zip" -f $env:GENR_VERSION)

          Copy-Item -LiteralPath $env:GENR_PKG -Destination $asset -Force
          "ASSET_NAME=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Prepared artifact: $asset"

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: genr-windows
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Ensure release exists
        if: ${{ env.RELEASE_NAME != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ env.RELEASE_NAME }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ env.RELEASE_NAME }}" --notes ""
          }

      - name: Upload Windows binary to release
        if: ${{ env.RELEASE_NAME != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.RELEASE_NAME }}" "$env:ASSET_NAME" --clobber
