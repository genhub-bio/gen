name: Python API Wheels

on:
  workflow_dispatch:

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install capnp (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp
      - name: Install capnp (Windows)
        if: runner.os == 'Windows'
        run: choco install capnproto
      - name: Stage bundled client (macOS)
        if: runner.os == 'macOS'
        run: make stage-python-client
      - name: Stage bundled client (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked --bin gen
          New-Item -ItemType Directory -Force "gen.gen.data/scripts"
          Copy-Item "target/release/gen.exe" "gen.gen.data/scripts/gen.exe"
      - name: Build wheels (Linux)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path gen-python/Cargo.toml --features extension-module --interpreter python${{ matrix.python-version }} --out gen-python/target/wheels
          manylinux: auto
          container: quay.io/pypa/manylinux_2_28_x86_64:latest
          sccache: true
          before-script-linux: |
            uv tool install "sccache>=0.10.0"
            yum install -y epel-release
            yum install -y clang llvm-devel sqlite-devel capnproto capnproto-devel pkgconfig mold
            cargo install capnpc --version ^0.24 --locked
            export PATH="/root/.cargo/bin:${PATH}"
            export CAPNPC_RUST="/root/.cargo/bin/capnpc-rust"
            mkdir -p gen-capnp-schemas/src/generated
            (cd gen-capnp-schemas && capnp compile -I . -orust:src/generated gen-core.capnp gen-models.capnp gen-schema.capnp)
            ls -la gen-capnp-schemas/src/generated
            make stage-python-client
          working-directory: .
        env:
          CAPNP: /usr/bin/capnp
          CAPNPC_RUST: /root/.cargo/bin/capnpc-rust
          LIBCLANG_PATH: /usr/lib64
      - name: Build wheels (macOS, Windows)
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path gen-python/Cargo.toml --features extension-module --interpreter ${{ steps.setup-python.outputs.python-path }} --out gen-python/target/wheels
          sccache: true
          working-directory: .
      - name: Verify wheel contents (macOS, Linux)
        if: runner.os != 'Windows'
        run: python gen-python/scripts/verify_wheel.py gen-python/target/wheels/*.whl
      - name: Verify wheel contents (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wheel = Get-ChildItem "gen-python/target/wheels/*.whl"
          python gen-python/scripts/verify_wheel.py "$($wheel.FullName)"
      - name: Smoke test wheel (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --force-reinstall --no-deps gen-python/target/wheels/*.whl
          python -c "import gen; print(gen.__version__)"
          gen --version
      - name: Smoke test wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wheel = Get-ChildItem "gen-python/target/wheels/*.whl"
          python -m pip install --force-reinstall --no-deps "$($wheel.FullName)"
          python -c "import gen; print(gen.__version__)"
          gen --version
      - name: Upload wheels to releases
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "${TAG}" gen-python/target/wheels/*.whl
      - name: Upload wheels to releases (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release upload "$env:TAG" "gen-python/target/wheels/*.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: gen-python/target/wheels/*.whl
          if-no-files-found: error

  trigger-pypi-publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    if: ${{ needs.build-wheels.result == 'success' }}
    permissions:
      actions: write
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Ensure tag is available
        run: |
          if [ -z "$TAG" ]; then
            echo "TAG is empty; cannot trigger publish-pypi-tag workflow." >&2
            exit 1
          fi
      - name: Trigger publish-pypi-tag workflow
        run: |
          gh workflow run publish-pypi-tag.yaml --repo "$REPO" --ref "$TAG" -f tag="$TAG"
