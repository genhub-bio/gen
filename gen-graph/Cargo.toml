[package]
name = "gen-graph"
description = "Graph algorithms and operations for the gen sequence graph and version control system."
version = "0.2.1"
edition = "2024"
repository = "https://github.com/genhub-bio/gen"
homepage = "https://genhub.bio"
license = "Apache-2.0"

[dependencies]
gen-core = { path = "../gen-core", version = "0.2.1" }
gen-models = { path = "../gen-models", version = "0.2.1" }
interavl = "0.3.0"
intervaltree = "0.2.7"
itertools = "0.14.0"
petgraph = "0.6.5"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
